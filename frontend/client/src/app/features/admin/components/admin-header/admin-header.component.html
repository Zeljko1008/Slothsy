<header class="flex items-center justify-between pl-4 pr-4 bg-white  sticky top-0 z-10">
  <!-- Left: Hamburger + Title -->
  <div class="flex items-center gap-4">
    <!-- Hamburger  -->
   <button
  class="md:hidden text-gray-700 focus:outline-none"
  (click)="toggleSidebar.emit()"
  aria-label="Toggle sidebar"
>
  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
       viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round"
          stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
  </svg>
</button>

   <img src="/images/slothsy.png" alt="app logo" class="max-h-20">
  </div>

  <!-- Center: Search -->
  <div class="flex-1 mx-4 hidden sm:block max-w-sm">
    <input
      #searchInput
      type="text"
      placeholder="Search products..."
      class="w-full px-4 py-2 border bg-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500 transition"
      (input)="onSearch(searchInput.value)"
    />
  </div>

  <!-- Right: Username + Logout -->
  <div class="flex items-center gap-4">
    <span class="text-gray-700 font-medium hidden sm:block">Admin</span>
    <button
      class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-md text-sm"
      (click)="onLogout()"
    >
      Logout
    </button>
  </div>
</header>
