<div class="flex justify-center  mt-8">
  <div class="col-span-12 columns-lg">
    <main class="form-signin">

      <form [formGroup]="registerForm" (ngSubmit)="register()" autocomplete="off">
        <div class="text-center mb-4 text-2xl">
          <p>
            Register

          </p>
        </div>
        <app-text-input label="First Name" formControlName="firstName"/>
        <app-text-input label="Last Name" formControlName="lastName"/>
        <app-text-input label="Email" formControlName="email" type="email"/>
        <app-text-input label="Password" formControlName="password" type="password"/>


<ul *ngIf="validationErrors?.length" class="mt-4 text-red-500 text-sm list-disc list-inside">
  <li *ngFor="let error of validationErrors">{{ error }}</li>
</ul>

        <div class="grid mt-4 px-1">
          <button
            class="bg-gradient-to-r from-pink-600 via-pink-800 to-pink-600 py-2 text-white rounded-lg hover:bg-blue-900 transition duration-200"
            type="submit"
          >
            Create Account
          </button>
        </div>

      </form>
    </main>
  </div>
</div>
