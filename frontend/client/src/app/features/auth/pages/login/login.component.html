<div class="flex justify-center mt-8">
  <div class="col-span-12 columns-lg">
    <main class="form-signin">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="text-center mb-4 text-2xl">
          <p>Login</p>
        </div>
        <div class="form-group mb-6 relative">
  <input
    type="email"
    id="email"
    formControlName="email"
    placeholder=" "
    class="peer block w-full appearance-none rounded-md border border-slate-300 bg-white px-3 pt-4 pb-2 text-sm text-gray-900 placeholder-transparent shadow-sm focus:border-pink-500 focus:outline-none focus:ring-1 focus:ring-pink-500"
  />
  <label
    for="email"
    class="absolute left-3 top-2 text-sm text-gray-500 transition-all peer-placeholder-shown:top-3 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-focus:top-1 peer-focus:text-sm peer-focus:text-pink-600"
  >
    Email
  </label>
</div>
         <div class="form-group mb-6 relative">
  <input
    type="password"
    id="password"
    formControlName="password"
    placeholder=" "
    class="peer block w-full appearance-none rounded-md border border-slate-300 bg-white px-3 pt-4 pb-2 text-sm text-gray-900 placeholder-transparent shadow-sm focus:border-pink-500 focus:outline-none focus:ring-1 focus:ring-pink-500"
  />
  <label
    for="password"
    class="absolute left-3 top-2 text-sm text-gray-500 transition-all peer-placeholder-shown:top-3 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 peer-focus:top-1 peer-focus:text-sm peer-focus:text-pink-600"
  >
    Password
  </label>
</div>
        <div class="grid mt-4 px-1">
          <button class="bg-gradient-to-r from-pink-600 via-pink-800 to-pink-600 py-2 text-white rounded-lg  hover:bg-pink-900 transition duration-200" type="submit">Login</button>
        </div>
        <div class="mt-4 text-center">
          <a class="text-blue-600 underline text-xs cursor-pointer">
            Forgot username or password?
          </a>
        </div>
      </form>
    </main>
  </div>
</div>
