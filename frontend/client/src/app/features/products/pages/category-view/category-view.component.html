<div *ngFor="let product of products" class="product-card">
  <h3>{{ product.name }}</h3>
  <p>{{ product.description }}</p>
  <span *ngIf="getLowestPrice(product) !== null">
    {{ getLowestPrice(product) | currency:'EUR' }}
  </span>
  <span *ngIf="getLowestPrice(product) === null">
    Nema dostupnih varijanti
  </span>
</div>
