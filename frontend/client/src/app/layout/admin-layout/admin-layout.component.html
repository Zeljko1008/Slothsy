<!-- Wrapper -->
<div class="flex flex-col min-h-screen">

  <!-- HEADER (uvijek prikazan) -->
  <app-admin-header (toggleSidebar)="toggleSidebar()"></app-admin-header>

  <!-- MAIN SECTION: sidebar + content -->
  <div class="flex flex-1 min-h-0">

    <!-- SIDEBAR (desktop) -->
    <aside class="hidden md:block w-64 bg-gray-100">
      <app-admin-sidebar></app-admin-sidebar>
    </aside>

    <!-- SIDEBAR (mobile drawer) -->
    <aside
      class="fixed inset-y-0 left-0 w-64 bg-white shadow-md z-40 transform transition-transform duration-200 ease-in-out md:hidden"
      [class.-translate-x-full]="!isSidebarOpen"
    >
      <app-admin-sidebar></app-admin-sidebar>
    </aside>

    <!-- OVERLAY (mobile) -->
    <div
      class="fixed inset-0 bg-black bg-opacity-50 z-30 md:hidden"
      *ngIf="isSidebarOpen"
      (click)="toggleSidebar()"
    ></div>

    <!-- PAGE CONTENT -->
    <div class="flex-1 overflow-auto p-4 bg-gray-100 rounded-lg shadow-md">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
