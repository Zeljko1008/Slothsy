<div
      [@snackBarAnimation]

      class="flex flex-col justify-between p-4 rounded-lg w-80 text-white shadow-lg"
    >
      <div class="flex items-center mb-3">
        <span class="mr-3 text-xl select-none">{{ getIcon(data.type) }}</span>
        <strong *ngIf="data.title" class="mr-1">{{ data.title }}:</strong> {{ data.message }}
      </div>
      <div class="flex justify-end">
        <button
          (click)="snackBarRef.dismiss()"
          class="bg-black bg-opacity-20 hover:bg-opacity-40 rounded-md px-3 py-1 transition"
        >
          Close
        </button>
      </div>
    </div>
